<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Contact</title>
  <style>
    /* ========== Reset & base ========== */
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; font-size: 16px; line-height: 1.5; color: #1a1a1a; background: #f5f5f5; padding: 24px; }

    /* ========== Spacing scale: 12 / 16 / 24 ========== */
    .add-contact-card { max-width: 640px; margin: 0 auto; background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); padding: 24px; }
    .add-contact-card h1 { margin: 0 0 24px; font-size: 1.5rem; font-weight: 700; color: #1a1a1a; }

    /* ========== Form layout: labels left, inputs right ========== */
    .add-contact-form { display: grid; gap: 16px; }
    .form-row { display: grid; grid-template-columns: 1fr; gap: 8px; align-items: start; }
    @media (min-width: 768px) {
      .form-row { grid-template-columns: 140px 1fr; align-items: center; }
      .form-row .form-label { padding-top: 0; }
    }
    .form-label { padding-top: 12px; font-size: 14px; font-weight: 500; color: #333; }
    .form-label label { cursor: pointer; }
    .form-label .required { color: #c00; }

    /* ========== Inputs: 44px min height, focus, WCAG-friendly ========== */
    .form-input,
    .form-select { width: 100%; min-height: 44px; padding: 12px 16px; font-size: 16px; line-height: 1.4; color: #1a1a1a; background: #fff; border: 1px solid #888; border-radius: 8px; }
    .form-input::placeholder { color: #666; }
    .form-input:focus,
    .form-select:focus { outline: 2px solid #0066cc; outline-offset: 2px; border-color: #0066cc; }
    .form-input:hover,
    .form-select:hover { border-color: #555; }
    .form-select { cursor: pointer; appearance: auto; }

    /* ========== Custom position panel (hidden by default) ========== */
    #customPositionWrap { display: none; margin-top: 12px; padding: 16px; background: #f8f9fa; border-radius: 8px; border: 1px solid #e0e0e0; }
    #customPositionWrap.visible { display: block; }
    .custom-pos-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .custom-pos-row .form-input { flex: 1; min-width: 160px; }
    .add-pos-btn { min-height: 44px; padding: 12px 20px; font-size: 14px; font-weight: 600; color: #fff; background: #0066cc; border: none; border-radius: 8px; cursor: pointer; }
    .add-pos-btn:hover { background: #0052a3; }
    .add-pos-btn:focus { outline: 2px solid #0066cc; outline-offset: 2px; }
    .helper-text { margin: 8px 0 0; font-size: 12px; color: #555; }
    .error-text { margin: 8px 0 0; font-size: 12px; color: #c00; display: none; }
    .error-text.visible { display: block; }

    /* ========== Submit area ========== */
    .form-actions { margin-top: 24px; padding-top: 16px; border-top: 1px solid #eee; }
    .submit-btn { min-height: 44px; padding: 12px 24px; font-size: 16px; font-weight: 600; color: #fff; background: #0066cc; border: none; border-radius: 8px; cursor: pointer; }
    .submit-btn:hover { background: #0052a3; }
    .submit-btn:focus { outline: 2px solid #0066cc; outline-offset: 2px; }
  </style>
</head>
<body>
  <!-- ========== Add Contact section ========== -->
  <div class="add-contact-card" role="region" aria-labelledby="add-contact-heading">
    <h1 id="add-contact-heading">Add Contact</h1>

    <form id="addContactForm" class="add-contact-form" novalidate>
      <!-- Salutation -->
      <div class="form-row">
        <div class="form-label">
          <label for="salutation">Salutation</label>
        </div>
        <div>
          <select id="salutation" class="form-select" name="salutation" aria-label="Salutation">
            <option value="">Select</option>
            <option value="Mr">Mr</option>
            <option value="Mrs">Mrs</option>
            <option value="Ms">Ms</option>
            <option value="Dr">Dr</option>
            <option value="Prof">Prof</option>
          </select>
        </div>
      </div>

      <!-- Name -->
      <div class="form-row">
        <div class="form-label">
          <label for="contactName">Name <span class="required" aria-hidden="true">*</span></label>
        </div>
        <div>
          <input type="text" id="contactName" class="form-input" name="name" placeholder="Enter full name" required aria-required="true" autocomplete="name" />
        </div>
      </div>

      <!-- Position -->
      <div class="form-row">
        <div class="form-label">
          <label for="positionSelect">Position</label>
        </div>
        <div>
          <select id="positionSelect" class="form-select" name="position" aria-label="Position" aria-describedby="positionCustomDesc">
            <option value="">Select position</option>
            <option value="CEO">CEO</option>
            <option value="MD">MD</option>
            <option value="HOD">HOD</option>
            <option value="Manager">Manager</option>
            <option value="Director">Director</option>
            <option value="Coordinator">Coordinator</option>
            <option value="Executive">Executive</option>
            <option value="__other__">Other / Add new…</option>
          </select>
          <div id="customPositionWrap" role="region" aria-live="polite" aria-label="Add new position">
            <div class="custom-pos-row">
              <input type="text" id="customPosition" class="form-input" placeholder="Type custom position" aria-label="Custom position" maxlength="80" />
              <button type="button" id="addPositionBtn" class="add-pos-btn">Add</button>
            </div>
            <p class="helper-text" id="positionCustomDesc">At least 2 letters. Duplicates are not allowed.</p>
            <p id="posError" class="error-text" role="alert"></p>
          </div>
        </div>
      </div>

      <!-- Contact Number -->
      <div class="form-row">
        <div class="form-label">
          <label for="contactNumber">Contact Number</label>
        </div>
        <div>
          <input type="tel" id="contactNumber" class="form-input" name="number" placeholder="Enter contact number" inputmode="tel" autocomplete="tel" />
        </div>
      </div>

      <!-- Email -->
      <div class="form-row">
        <div class="form-label">
          <label for="contactEmail">Email</label>
        </div>
        <div>
          <input type="email" id="contactEmail" class="form-input" name="email" placeholder="Enter email" autocomplete="email" />
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="submit-btn">Save Contact</button>
      </div>
    </form>
  </div>

  <script>
    (function () {
      // --- IDs as specified ---
      var positionSelect = document.getElementById('positionSelect');
      var customPositionWrap = document.getElementById('customPositionWrap');
      var customPosition = document.getElementById('customPosition');
      var addPositionBtn = document.getElementById('addPositionBtn');
      var posError = document.getElementById('posError');

      var OTHER_VALUE = '__other__';
      var otherOption = null;

      function getOtherOption() {
        if (!otherOption) {
          var opts = positionSelect.querySelectorAll('option');
          for (var i = 0; i < opts.length; i++) {
            if (opts[i].value === OTHER_VALUE) { otherOption = opts[i]; break; }
          }
        }
        return otherOption;
      }

      // Show/hide custom position panel based on select
      function toggleCustomPositionPanel() {
        var isOther = positionSelect.value === OTHER_VALUE;
        customPositionWrap.classList.toggle('visible', isOther);
        if (!isOther) {
          posError.classList.remove('visible');
          posError.textContent = '';
        }
      }

      positionSelect.addEventListener('change', toggleCustomPositionPanel);
      toggleCustomPositionPanel(); // init: hide if not Other

      // Title Case helper
      function toTitleCase(str) {
        return str.trim().replace(/\w\S*/g, function (t) {
          return t.charAt(0).toUpperCase() + t.slice(1).toLowerCase();
        });
      }

      // Check if position already exists (case-insensitive)
      function positionExists(text) {
        var lower = text.trim().toLowerCase();
        var opts = positionSelect.querySelectorAll('option');
        for (var i = 0; i < opts.length; i++) {
          if (opts[i].value && opts[i].value !== OTHER_VALUE && opts[i].value.toLowerCase() === lower)
            return true;
        }
        return false;
      }

      function showPosError(msg) {
        posError.textContent = msg || '';
        posError.classList.toggle('visible', !!msg);
      }

      addPositionBtn.addEventListener('click', function () {
        var raw = customPosition.value || '';
        var trimmed = raw.trim();
        showPosError('');

        // Validation: at least 2 letters
        if (trimmed.length < 2) {
          showPosError('Please enter at least 2 characters.');
          customPosition.focus();
          return;
        }

        var titleCased = toTitleCase(raw);

        // Prevent duplicates (case-insensitive)
        if (positionExists(titleCased)) {
          showPosError('This position is already in the list.');
          customPosition.focus();
          return;
        }

        // Insert new option at the top (pahalata) — right after "Select position"
        var opt = document.createElement('option');
        opt.value = titleCased;
        opt.textContent = titleCased;
        var firstReal = positionSelect.options[1]; // after empty "Select position"
        if (firstReal) {
          positionSelect.insertBefore(opt, firstReal);
        } else {
          positionSelect.appendChild(opt);
        }

        // Select the new option, clear input, hide panel
        positionSelect.value = titleCased;
        customPosition.value = '';
        customPositionWrap.classList.remove('visible');
        showPosError('');

        // Optional: persist new position to server
        // await fetch('/api/positions', { method: 'POST', body: JSON.stringify({ label: titleCased }) });
      });
    })();
  </script>

  <!--
  README (extend options / API):
  - To add more default positions: add <option value="Title">Title</option> before the "Other / Add new…" option in #positionSelect.
  - To persist new positions: in the addPositionBtn click handler, after insertBefore(opt, other), add an API call (e.g. fetch POST to /api/positions) and optionally sync the dropdown from the response.
  - Form submit is not wired; hook into addContactForm submit to send Salutation, Name, Position, Contact Number, Email to your backend.
  -->
</body>
</html>
